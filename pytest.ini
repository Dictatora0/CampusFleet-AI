[pytest]
# Pytest 配置文件

# 测试文件的搜索模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests .

# 显示选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    slow: 标记运行较慢的测试
    unit: 单元测试
    integration: 集成测试
    pathfinding: 路径规划相关测试
    agents: 智能体相关测试
    scheduler: 调度器相关测试

# 覆盖率报告配置（需要pytest-cov插件）
# 运行: pytest --cov=. --cov-report=html
