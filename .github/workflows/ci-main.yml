name: CI - Production

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-production:
    name: Production Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Run tests with strict mode
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short --strict-markers

      - name: Generate coverage report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ --cov=core --cov-report=xml --cov-report=term --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: production
          name: main-coverage
          fail_ci_if_error: true

  code-quality-production:
    name: Code Quality (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy bandit

      - name: Check code formatting with Black
        run: |
          black --check core/ tests/ --line-length 100

      - name: Check import sorting with isort
        run: |
          isort --check-only core/ tests/ --profile black

      - name: Lint with flake8
        run: |
          flake8 core/ --max-line-length=100 --extend-ignore=E203,W503 --count --statistics

      - name: Type check with mypy
        run: |
          mypy core/ --ignore-missing-imports

      - name: Security scan with Bandit
        run: |
          bandit -r core/ -f json -o bandit-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-production, code-quality-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run integration tests
        run: |
          pytest tests_integration/ -v --tb=short || echo "Integration tests not yet implemented"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test-production, code-quality-production, integration-tests]
    if: success()

    steps:
      - name: Success notification
        run: |
          echo "✅ All production checks passed!"
          echo "Ready for deployment"
